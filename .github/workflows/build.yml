
name: Build PEDULI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PeduliAndroid_Starter_Project.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o PeduliAndroid_Starter_Project.zip
          ls -la
          test -f PeduliAndroid/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: PeduliAndroid
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PEDULI-APK
          path: PeduliAndroid/app/build/outputs/apk/debug/app-debug.apk
